name: Cerevance
description: 'Cerevance is a clinical-stage biopharmaceutical company developing novel therapeutics
  for central nervous system (CNS) disorders. Its proprietary NETSseq platform profiles gene
  expression across specific human brain cell types from post-mortem tissue to identify previously
  undiscovered, cell-type-specific drug targets, powering a pipeline of small-molecule candidates
  for Parkinson''s disease, Alzheimer''s disease, epilepsy, and other neurodegenerative and
  psychiatric conditions. Surfaced as a portfolio company of GV; profiled in the API Evangelist
  network. Cerevance publishes no public API, developer portal, or SDK.'
